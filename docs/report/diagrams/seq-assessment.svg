<line x1="122" y1="74" x2="308" y2="74" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="216" y="68" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">POST /api/assessments/:id/submit</text>
<line x1="318" y1="114" x2="504" y2="114" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="412" y="108" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">submitSchema.parse(body)</text>
<line x1="514" y1="154" x2="896" y2="154" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="706" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">find attempt by idempotencyKey</text>
<line x1="898" y1="194" x2="516" y2="194" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="706" y="188" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">none - proceed</text>
<line x1="514" y1="234" x2="896" y2="234" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="706" y="228" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">load questions, options, scenarios</text>
<line x1="514" y1="274" x2="700" y2="274" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="608" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">scoreAnswers() and scoreScenarios()</text>
<line x1="702" y1="314" x2="516" y2="314" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="608" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">perQuestion, perStep, percentages</text>
<line x1="514" y1="354" x2="700" y2="354" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="608" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">combineScores(mcq, practical, mcqWeight)</text>
<line x1="514" y1="394" x2="896" y2="394" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="706" y="388" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">BEGIN TRANSACTION</text>
<line x1="514" y1="434" x2="896" y2="434" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="706" y="428" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">update attempt, insert answers/responses</text>
<line x1="514" y1="474" x2="700" y2="474" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="608" y="468" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">applyCompetencyEvidence(kind: ASSESSMENT)</text>
<line x1="710" y1="514" x2="896" y2="514" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="804" y="508" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">upsert EmployeeCompetency + CompetencyHistory</text>
<line x1="514" y1="554" x2="896" y2="554" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="706" y="548" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">issue Certificate if passed, notify, audit</text>
<line x1="514" y1="594" x2="896" y2="594" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="706" y="588" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">COMMIT</text>
<line x1="506" y1="634" x2="320" y2="634" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="412" y="628" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">result + competencyImpacts</text>
<line x1="310" y1="674" x2="124" y2="674" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="216" y="668" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">200 { attempt, impacts, review }</text>
<rect x="24" y="724" width="972" height="44" rx="6" fill="#FFFBEB" stroke="#F59E0B"/>
<text x="510" y="742" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#92400E" text-anchor="middle">Scoring, the competency update and the certificate all commit in one transaction, so a competency can never move without the attempt that moved it.</text>
</svg>