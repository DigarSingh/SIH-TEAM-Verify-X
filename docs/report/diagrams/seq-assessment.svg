<rect x="422" y="18" width="176" height="40" rx="7" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.3"/>
<text x="510" y="41" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#102A43" text-anchor="middle">attempts.service</text>
