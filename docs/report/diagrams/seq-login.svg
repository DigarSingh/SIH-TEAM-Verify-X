<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 544" width="880" height="544" role="img" aria-label="Sequence: sign-in and session establishment">
<title>Sequence: sign-in and session establishment</title>

<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
    <path d="M0,0 L8,3.2 L0,6.4 z" fill="#64748B"/>
  </marker>
  <marker id="ahs" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
    <path d="M0,0 L8,3.2 L0,6.4 z" fill="#2D8CFF"/>
  </marker>
  <marker id="ahOpen" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#64748B" stroke-width="1.3"/>
  </marker>
</defs>
<rect width="880" height="544" fill="#FFFFFF"/>
<rect x="30" y="18" width="190" height="40" rx="7" fill="#EAF4FF" stroke="#2D8CFF" stroke-width="1.3"/>
<text x="125" y="41" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#102A43" text-anchor="middle">Browser</text>
<line x1="125" y1="58" x2="125" y2="480" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="4 4"/>
<rect x="240" y="18" width="190" height="40" rx="7" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.3"/>
<text x="335" y="41" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#102A43" text-anchor="middle">Express API</text>
<line x1="335" y1="58" x2="335" y2="480" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="4 4"/>
<rect x="450" y="18" width="190" height="40" rx="7" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.3"/>
<text x="545" y="41" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#102A43" text-anchor="middle">authenticate / auth.service</text>
<line x1="545" y1="58" x2="545" y2="480" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="4 4"/>
<rect x="660" y="18" width="190" height="40" rx="7" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.3"/>
<text x="755" y="41" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#102A43" text-anchor="middle">PostgreSQL</text>
<line x1="755" y1="58" x2="755" y2="480" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="4 4"/>
<line x1="129" y1="74" x2="329" y2="74" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="230" y="68" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">POST /api/auth/login  { email, password }</text>
<line x1="339" y1="114" x2="539" y2="114" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="440" y="108" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">validate body (Zod), check lock-out</text>
<line x1="549" y1="154" x2="749" y2="154" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="650" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">SELECT user by email</text>
<line x1="751" y1="194" x2="551" y2="194" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="650" y="188" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">user row (passwordHash)</text>
<path d="M545,226 q40,0 40,12 q0,12 -40,12" fill="none" stroke="#2D8CFF" stroke-width="1.3" stroke-dasharray="0" marker-end="url(#ahs)"/>
<text x="595" y="238" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="start">argon2.verify(hash, password)</text>
<line x1="549" y1="274" x2="749" y2="274" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="650" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">create Session (refresh token hash), AuditLog</text>
<line x1="541" y1="314" x2="341" y2="314" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="440" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">access + refresh JWT</text>
<line x1="331" y1="354" x2="131" y2="354" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="230" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">200 Set-Cookie (HttpOnly, SameSite)</text>
<line x1="129" y1="394" x2="329" y2="394" stroke="#2D8CFF" stroke-width="1.3" marker-end="url(#ahs)"/>
<text x="230" y="388" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">GET /api/users/me  (cookie)</text>
<line x1="331" y1="434" x2="131" y2="434" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="230" y="428" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">200 { user }</text>
<rect x="24" y="484" width="832" height="44" rx="6" fill="#FFFBEB" stroke="#F59E0B"/>
<text x="440" y="502" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#92400E" text-anchor="middle">Tokens are never readable by JavaScript. A refresh reuses the rotating token and detects replay; the CSRF header X-Requested-With is required on</text>
<text x="440" y="515" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#92400E" text-anchor="middle">every state-changing call.</text>
</svg>