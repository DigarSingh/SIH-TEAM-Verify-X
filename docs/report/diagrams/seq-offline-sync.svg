<text x="608" y="548" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">200</text>
<line x1="506" y1="594" x2="124" y2="594" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="314" y="588" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" font-weight="400" fill="#102A43" text-anchor="middle">SYNC COMPLETE</text>
<rect x="24" y="644" width="972" height="44" rx="6" fill="#FFFBEB" stroke="#F59E0B"/>
<text x="510" y="662" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#92400E" text-anchor="middle">The service worker handles GET requests only. Writes are queued by the application so retry, ordering, the idempotency key and the message the learner sees all live in</text>
<text x="510" y="675" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#92400E" text-anchor="middle">one place.</text>
