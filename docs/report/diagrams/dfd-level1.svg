<line x1="580" y1="215" x2="718" y2="215" stroke="#64748B" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="820" y1="130" x2="820" y2="178" stroke="#64748B" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="820" y1="250" x2="820" y2="298" stroke="#64748B" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="140" y1="130" x2="140" y2="178" stroke="#64748B" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="140" y1="250" x2="140" y2="298" stroke="#64748B" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="140" y1="370" x2="140" y2="418" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<line x1="480" y1="370" x2="480" y2="418" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<line x1="820" y1="370" x2="820" y2="418" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
</svg>