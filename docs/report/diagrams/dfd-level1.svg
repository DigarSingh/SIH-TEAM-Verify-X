<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Data flow diagram, level 1: the competency engine">
<title>Data flow diagram, level 1: the competency engine</title>

<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
    <path d="M0,0 L8,3.2 L0,6.4 z" fill="#64748B"/>
  </marker>
  <marker id="ahs" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
    <path d="M0,0 L8,3.2 L0,6.4 z" fill="#2D8CFF"/>
  </marker>
  <marker id="ahOpen" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7" fill="none" stroke="#64748B" stroke-width="1.3"/>
  </marker>
</defs>
<rect width="960" height="470" fill="#FFFFFF"/>
<text x="480" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Process 4 - Competency engine, expanded</text>
<rect x="40" y="60" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#2D8CFF" stroke-width="1.2"/><text x="140" y="84.25" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#102A43" text-anchor="middle">4.1 Resolve requirement</text><text x="140" y="101.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">RoleCompetency for the</text><text x="140" y="114.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">person's job role</text>
<rect x="40" y="180" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#2D8CFF" stroke-width="1.2"/><text x="140" y="204.25" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#102A43" text-anchor="middle">4.2 Read current level</text><text x="140" y="221.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">EmployeeCompetency</text><text x="140" y="234.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">(verified baseline)</text>
<rect x="40" y="300" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#2D8CFF" stroke-width="1.2"/><text x="140" y="324.25" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#102A43" text-anchor="middle">4.3 Apply decay</text><text x="140" y="341.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">baseline x 0.5^(days/halfLife)</text><text x="140" y="354.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">never stored</text>
<rect x="380" y="60" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#2D8CFF" stroke-width="1.2"/><text x="480" y="84.25" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#102A43" text-anchor="middle">4.4 Compute skill gap</text><text x="480" y="101.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">required - effective,</text><text x="480" y="114.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">severity band</text>
<rect x="380" y="180" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#2D8CFF" stroke-width="1.2"/><text x="480" y="204.25" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#102A43" text-anchor="middle">4.5 Compute priority</text><text x="480" y="221.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">gap x importance x</text><text x="480" y="234.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">role criticality, normalised</text>
<rect x="380" y="300" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#2D8CFF" stroke-width="1.2"/><text x="480" y="324.25" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#102A43" text-anchor="middle">4.6 Classify freshness</text><text x="480" y="341.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">Current / Watch / At risk /</text><text x="480" y="354.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">Critical / Expired</text>
<rect x="720" y="60" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#2D8CFF" stroke-width="1.2"/><text x="820" y="84.25" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#102A43" text-anchor="middle">4.7 Gather evidence</text><text x="820" y="101.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">assessment, evaluation,</text><text x="820" y="114.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">practical (incl. AR)</text>
<rect x="720" y="180" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#2D8CFF" stroke-width="1.2"/><text x="820" y="204.25" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#102A43" text-anchor="middle">4.8 Blend and update</text><text x="820" y="221.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">weighted blend with the</text><text x="820" y="234.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">previous level, capped</text>
<rect x="720" y="300" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#2D8CFF" stroke-width="1.2"/><text x="820" y="324.25" font-family="Inter, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#102A43" text-anchor="middle">4.9 Write history</text><text x="820" y="341.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">append-only row with the</text><text x="820" y="354.75" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#64748B" text-anchor="middle">inputs and explanation</text>
<rect x="40" y="420" width="196" height="30" fill="#F1F5F9" stroke="#0B1F3A"/><text x="138" y="439" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#102A43" text-anchor="middle">D1 Users &amp; framework</text>
<rect x="380" y="420" width="196" height="30" fill="#F1F5F9" stroke="#0B1F3A"/><text x="478" y="439" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#102A43" text-anchor="middle">D6 Decay policies</text>
<rect x="720" y="420" width="196" height="30" fill="#F1F5F9" stroke="#0B1F3A"/><text x="818" y="439" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#102A43" text-anchor="middle">D4 Competency state</text>
<line x1="240" y1="95" x2="378" y2="95" stroke="#64748B" stroke-width="1.3" marker-end="url(#ah)"/>
