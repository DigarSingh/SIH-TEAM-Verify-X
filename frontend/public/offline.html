<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1F3A" />
    <title>Offline | Capacity Connect</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f8fb;
        color: #0b1f3a;
      }
      .card {
        max-width: 26rem;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 10px 30px rgb(11 31 58 / 8%);
      }
      h1 {
        font-size: 1.35rem;
        margin: 18px 0 8px;
      }
      p {
        margin: 0 0 8px;
        color: #475569;
        line-height: 1.6;
        font-size: 0.95rem;
      }
      button {
        margin-top: 18px;
        padding: 10px 20px;
        border: 0;
        border-radius: 10px;
        background: #2d8cff;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1e6fd9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon-192.png" alt="" width="64" height="64" />
      <h1>You are offline</h1>
      <p>Capacity Connect could not reach the network, and this device has not yet saved a copy of the app.</p>
      <p>Open the app once while connected, and saved courses will then be available offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
